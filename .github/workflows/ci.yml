name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Base Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Apply Compatibility Adjustments
      run: |
        pip install "numpy<2.0.0" click

    - name: Download spaCy Model
      run: |
        python -m spacy download en_core_web_sm

    - name: Run Linting Checks (Ruff)
      run: |
        # Stop build if there are syntax errors or undefined names
        # Warnings and unused imports are also checked based on pyproject.toml rules
        python -m ruff check .

    - name: Run Test Suite (Pytest)
      env:
        PYTHONPATH: src
      run: |
        python -m pytest tests/ --cov=src --cov-report=xml
